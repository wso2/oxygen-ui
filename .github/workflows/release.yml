# This workflow will release the packages.

name: 🚀 Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
  workflow_dispatch:

# GITHUB_TOKEN permissions. Version commits are pushed with UI_BOT_TOKEN.
# pages: write deploys the docs site after a publish.
# IMPORTANT: DO NOT REMOVE. `id-token` is required for OIDC publishing to npm.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  GH_TOKEN: ${{ secrets.UI_BOT_TOKEN }}

jobs:
  release:
    name: 📦 Release
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [lts/*]
        pnpm-version: [latest]

    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: 🥡 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
          run_install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: 🟢 Setup node
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: 🔐 Remove npm auth token so publish uses OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken=/d' "$npmrc"
          fi

      - name: 🧩 Install Dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build
        id: build
        run: pnpm build

      - name: 📣 Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1.7.0
        with:
          title: '[Release] [GitHub Action] Update package versions'
          publish: pnpm publish:packages
          version: pnpm version:packages
          commit: "[WSO2 Release] [GitHub Action] [Release] [${{ github.ref_name }}] [skip ci] update package versions"
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}

      - name: ⚙️ Setup Pages to Deploy Documentation
        if: steps.changesets.outputs.published == 'true'
        id: setup-pages
        uses: actions/configure-pages@v5

      - name: 🌩 Upload Documentation Artifact
        if: steps.changesets.outputs.published == 'true'
        id: upload-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/oxygen-ui-docs/dist

      - name: 🔥 Deploy to GitHub Pages
        if: steps.changesets.outputs.published == 'true'
        id: deploy-gh-pages
        uses: actions/deploy-pages@v4
